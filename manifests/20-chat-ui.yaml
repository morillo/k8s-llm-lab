apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-ui-config
  namespace: llm
data:
  LLM_BASE_URL: "http://vllm.llm.svc.cluster.local:8000/v1"   # <service>.<namespace>.svc.cluster.local
  LLM_MODEL: "qwen2.5-1.5b"                                   # must match --served-model-name
  MAX_TOKENS: "256"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  namespace: llm
  labels: {app: chat-ui}
spec:
  replicas: 2
  selector:
    matchLabels: {app: chat-ui}
  template:
    metadata:
      labels: {app: chat-ui}
    spec:
      containers:
        - name: chat-ui
          image: localhost:5001/chat-ui:0.1.0
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: chat-ui-config}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui
  namespace: llm
spec:
  type: NodePort
  selector: {app: chat-ui}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30080}   # 30080 is mapped to localhost:8080
