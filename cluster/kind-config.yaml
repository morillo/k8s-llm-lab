kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080      # NodePort used by the chat UI Service
        hostPort: 8080            # what you open in the browser
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      pool: apps
  - role: worker
    labels:
      pool: inference
