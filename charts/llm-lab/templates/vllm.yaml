apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache
  annotations:
    helm.sh/resource-policy: keep        # helm uninstall leaves the downloaded model in place
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.vllm.cache.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.vllm.cache.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: {app: vllm}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: vllm}
  template:
    metadata:
      labels: {app: vllm}
    spec:
      enableServiceLinks: false
      {{- with .Values.vllm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vllm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ required "set vllm.image.tag (source lab.env, then --set vllm.image.tag=$VLLM_TAG)" .Values.vllm.image.tag }}"
          command: ["vllm", "serve"]
          args:
            - {{ .Values.vllm.model | quote }}
            - --host=0.0.0.0
            - --port=8000
            - --served-model-name={{ .Values.vllm.servedModelName }}
            - --dtype={{ .Values.vllm.dtype }}
            - --max-model-len={{ .Values.vllm.maxModelLen }}
            - --max-num-seqs={{ .Values.vllm.maxNumSeqs }}
            {{- range .Values.vllm.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - {name: HF_HOME, value: /models/hf}
            - {name: VLLM_CACHE_ROOT, value: /models/vllm}
            {{- range $name, $value := .Values.vllm.env }}
            - {name: {{ $name }}, value: {{ $value | quote }}}
            {{- end }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: hf-token, key: HF_TOKEN, optional: true}
          ports:
            - {name: http, containerPort: 8000}
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
          {{- with .Values.vllm.capabilities }}
          securityContext:
            capabilities:
              add:
                {{- toYaml . | nindent 16 }}
          {{- end }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - {name: hf-cache, mountPath: /models}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: hf-cache
          persistentVolumeClaim: {claimName: hf-cache}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  labels: {app: vllm}
spec:
  selector: {app: vllm}
  ports:
    - {name: http, port: 8000, targetPort: http}
