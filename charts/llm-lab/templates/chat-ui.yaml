apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-ui
  labels: {app: chat-ui}
spec:
  replicas: {{ .Values.chatUi.replicas }}
  selector:
    matchLabels: {app: chat-ui}
  template:
    metadata:
      labels: {app: chat-ui}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/chat-ui-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: chat-ui
          image: "{{ .Values.chatUi.image.repository }}:{{ .Values.chatUi.image.tag }}"
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: chat-ui-config}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: chat-ui
spec:
  type: NodePort
  selector: {app: chat-ui}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: {{ .Values.chatUi.nodePort }}}
